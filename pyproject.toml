[project]
name = "clinsynapse"
version = "2.0.0"
description = "Agentic biomedical QA over PubMed with verifiable citations, abstention, and CI-gated evals."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "langgraph>=0.2.40",
    "bm25s>=0.2.5",
    "PyStemmer>=2.2",
    "qdrant-client>=1.11",
    "transformers>=4.44",
    "torch>=2.4",
    "datasets>=2.20",
    "numpy>=1.26",
    "scipy>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.6",
]
ui = ["streamlit>=1.38", "httpx>=0.28.1"]
obs = ["langfuse>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinsynapse", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
