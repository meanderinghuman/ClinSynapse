# API + UI + Qdrant + Langfuse.
# Build the index into the Qdrant service first:
#   docker compose up -d qdrant
#   CS_QDRANT_URL=http://localhost:6333 uv run python -m clinsynapse.retrieval.build
# Elasticsearch is the planned BM25 backend for the full 2.4M corpus; at the current scale
# BM25 runs in-process (bm25s), so it is behind a profile:  docker compose --profile es up
services:
  api:
    build: .
    env_file: .env
    environment:
      CS_DEVICE: cpu
      CS_QDRANT_URL: http://qdrant:6333
      LANGFUSE_HOST: http://langfuse:3000
    volumes:
      - ./data:/app/data
      - hf-cache:/root/.cache/huggingface
    ports: ["8000:8000"]
    depends_on: [qdrant]

  ui:
    build: .
    command: ["uv", "run", "--no-sync", "streamlit", "run", "ui/app.py", "--server.address=0.0.0.0"]
    environment:
      CS_API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes: [qdrant-data:/qdrant/storage]
    ports: ["6333:6333"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: [es]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms2g -Xmx2g
    ports: ["9200:9200"]

  langfuse:
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me
      SALT: change-me
    ports: ["3000:3000"]
    depends_on: [langfuse-db]

  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes: [langfuse-db:/var/lib/postgresql/data]

volumes:
  hf-cache:
  qdrant-data:
  langfuse-db:
